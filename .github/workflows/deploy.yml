name: Validate and deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'data.json'
      - 'index.html'
      - 'openapi.json'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

concurrency:
  group: pages-india-pincodes-by-state
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON data files
        run: |
          set -euo pipefail
          for f in data/*.json data.json; do
            [ -f "$f" ] || continue
            [ "$f" = "data/schema.json" ] && continue
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f'))"
          done
      - name: Validate OpenAPI spec
        run: |
          node -e "JSON.parse(require('fs').readFileSync('openapi.json'))"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
